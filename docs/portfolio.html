<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio - USDA Section 515 Property Atlas</title>
<meta name="description" content="A saved portfolio of USDA Section 515 properties.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="mask-icon" href="favicon.svg" color="#081937">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/select.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="assets/config.js"></script>
<script>
// Hide the interface before first paint when the data is gated and there is no
// session yet. Without this the frame flashes up and is then covered.
(function () {
  var base = window.ATLAS_DATA_BASE || "data";
  if (!/^https?:\/\//i.test(base)) return;
  var stored = null;
  try { stored = localStorage.getItem("atlas.session"); } catch (e) {}
  if (!stored && !/[#&]atlas_token=/.test(location.hash || "")) {
    document.documentElement.className += " atlas-locked";
  }
})();
</script>

</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <h1>USDA Section 515 Property Atlas</h1>
    <p class="sub" id="masthead-sub">Rural Rental Housing and Farm Labor Housing, from USDA Rural Development open data</p>
    <div class="session" id="session"></div>
  </div>
  <p class="asof" id="asof"></p>
  <nav class="tabs">
    <a href="index.html">Table</a>
    <a href="map.html">Map</a>
    <a href="companies.html">Companies</a>
    <a href="portfolios.html" class="active">Portfolios</a>
  </nav>
</header>
<main>
  <p class="backline"><a href="portfolios.html">&larr; All portfolios</a></p>

  <div class="panel pf-detailhead" id="pf-head">
    <div class="loading">Loading portfolio...</div>
  </div>

  <div class="stats" id="pf-stats"></div>

  <div class="pf-detail">
    <div class="panel pf-tablewrap">
      <div class="table-wrap">
        <table class="grid" id="pf-grid">
          <thead><tr id="pf-headrow"></tr></thead>
          <tbody id="pf-rows"><tr><td class="loading" colspan="12">Loading properties...</td></tr></tbody>
          <tfoot><tr id="pf-totals"></tr></tfoot>
        </table>
      </div>
      <p class="note" id="pf-tablenote"></p>
    </div>

    <aside class="pf-side">
      <div class="panel minimap-wrap">
        <h3 class="minimap-title">Portfolio map</h3>
        <div id="pf-map" class="minimap"></div>
        <p class="note" id="pf-mapnote"></p>
      </div>
      <div class="panel" id="pf-breakdown"></div>
    </aside>
  </div>
</main>

<footer class="datanote">
  <p class="pf-foot" id="pf-foot"></p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="assets/app.js"></script>
<script src="assets/export.js"></script>
<script src="assets/portfolio.js"></script>
</body>
</html>
